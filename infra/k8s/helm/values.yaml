namespace: default
domain: server.mikekim1032.shop
email: ""

gateway:
  issuer: my-issuer
  tlsSecret: server-mikekim1032-com-tls

auth:
  issuer: "https://your-issuer.com"
  base64UrlSecret: ""

circuitBreaker:
  maxConnections: 100
  consecutiveErrors: 5
  baseEjectionTime: 30s
  maxPendingRequests: 100 # Limits requests waiting in the queue
  maxParallelRequests: 100 # Limits active, concurrent HTTP requests

apps:
  auth:
    image: "auth-service:latest"
    port: 8080
    routePath: /auth
  chat:
    image: "chat-service:latest"
    port: 8080
    routePath: /chat
    requireAuth: true
  expo-notification:
    image: "expo-notification-service:latest"
    port: 8080
    routePath: /notification
    isWorker: true
