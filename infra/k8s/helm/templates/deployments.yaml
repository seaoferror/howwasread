{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  # replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        framework: {{ $app.framework | default "none" }}
    spec:
      {{if eq $.Values.registry "ghcr.io/seaoferror" }}
      imagePullSecrets:
        - name: ghcr
      {{-end}}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.registry }}/{{ $app.image }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $app.port }}
{{/*          resources:*/}}
{{/*            requests:*/}}
{{/*              cpu: {{ $app.cpuRequests }}*/}}
{{/*              memory: {{ $app.memoryRequests }}*/}}
{{/*            limits:*/}}
{{/*              cpu: {{ $app.cpuLimits }}*/}}
{{/*              memory: {{ $app.memoryLimits }}*/}}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: config-map
            {{- if $app.astradb }}
            - secretRef:
                name: astradb
            {{- end }}
            {{- if $app.aws }}
            - secretRef:
                name: aws
            {{- end }}
            {{- if $app.tidb }}
            - secretRef:
                name: tidb
            {{- end }}
            {{- if $app.smtp }}
            - secretRef:
                name: smtp
            {{- end }}
            {{- if $app.twilio }}
            - secretRef:
                name: twilio
            {{- end }}
            {{- if $app.confluent }}
            - secretRef:
                name: confluent
            {{- end }}
            {{- if $app.valkey }}
            - secretRef:
                name: valkey
            {{- end }}
            {{- if $app.opensearch }}
            - secretRef:
                name: opensearch
            {{- end }}
          volumeMounts:
            {{- if $app.authentication}}
            - name: authentication-volume
              mountPath: "/cert/authentication"
              readOnly: true
            {{- end}}
            {{- if $app.astradb }}
            - name: astradb-volume
              mountPath: "/cert/astradb"
              readOnly: true
            {{- end }}
            {{- if $app.aws }}
            - name: aws-volume
              mountPath: "/cert/aws"
              readOnly: true
            {{- end }}
            {{- if $app.firebase }}
            - name: firebase-volume
              mountPath: "/cert/firebase"
              readOnly: true
            {{- end }}
            {{- if $app.mongodb }}
            - name: mongodb-volume
              mountPath: "/cert/mongodb"
              readOnly: true
            {{- end }}
            {{- if $app.kafka }}
            - name: kafka-volume
              mountPath: "/cert/kafka"
              readOnly: true
            {{- end }}
      volumes:
        {{- if $app.authentication}}
        - name: authentication-volume
          secret:
            secretName: authentication-volume
        {{- end}}
        {{- if $app.astradb }}
        - name: astradb-volume
          secret:
            secretName: astradb-volume
        {{- end }}
        {{- if $app.aws }}
        - name: aws-volume
          secret:
            secretName: aws-volume
        {{- end }}
        {{- if $app.firebase }}
        - name: firebase-volume
          secret:
            secretName: firebase-volume
        {{- end }}
        {{- if $app.mongodb }}
        - name: mongodb-volume
          secret:
            secretName: mongodb-volume
        {{- end }}
        {{- if $app.kafka }}
        - name: kafka-volume
          secret:
            secretName: kafka-volume
        {{- end}}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ $app.port }}

---

{{/*apiVersion: autoscaling/v2*/}}
{{/*kind: HorizontalPodAutoscaler*/}}
{{/*metadata:*/}}
{{/*  name: {{ $name }}*/}}
{{/*  namespace: {{ $.Values.namespace }}*/}}
{{/*spec:*/}}
{{/*  scaleTargetRef:*/}}
{{/*    apiVersion: apps/v1*/}}
{{/*    kind: Deployment*/}}
{{/*    name: {{ $name }}*/}}
{{/*  minReplicas: 1*/}}
{{/*  maxReplicas: 2*/}}
{{/*  metrics:*/}}
{{/*    - type: Resource*/}}
{{/*      resource:*/}}
{{/*        name: cpu*/}}
{{/*        target:*/}}
{{/*          type: Utilization*/}}
{{/*          averageUtilization: 80*/}}

{{- end }}
