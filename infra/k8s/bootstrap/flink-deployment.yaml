apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-deployment
  namespace: flink
spec:
  image: ghcr.io/seaoferror/backend/schedulednotificationjob:latest
  imagePullSecrets:
    - name: ghcr
  flinkVersion: v2_2_1
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    state.backend: rocksdb
    state.backend.incremental: "true"
    state.backend.rocksdb.memory.managed: "true"
    taskmanager.memory.managed.fraction: "0.4"
  serviceAccount: flink
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  job:
    jarURI: local:///opt/flink/usrlib/schedulednotificationjob.jar
    entryClass: com.howwasread.ScheduledNotificationJob
    parallelism: 2
    upgradeMode: stateless