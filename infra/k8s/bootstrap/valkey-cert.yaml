apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-cert
  namespace: valkey-system
spec:
  secretName: valkey-cert
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    # client auth for connection between valkey pods to sync data
    - client auth
  dnsNames:
    - valkey-valkey-cluster.valkey-system.svc
    - valkey-valkey-cluster.valkey-system.svc.cluster.local
    - "*.valkey-cluster.valkey-system.svc.cluster.local"
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: backend
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: backend