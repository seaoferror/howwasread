apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: valkey-cluster
  namespace: valkey-system
spec:
  shards: 1
  replicas: 0
  tls:
    certificate:
      secretName: valkey-cert
  users:
      # this name is VALKEY_USERNAME
    - name: lule
      enabled: true
      passwordSecret:
        name: valkey
        keys:
          - lule
      commands:
        allow: ["@all"]
      keys:
        readWrite: ["*"]