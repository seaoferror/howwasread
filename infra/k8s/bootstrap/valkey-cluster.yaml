apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: valkey-cluster
  namespace: valkey-system
spec:
  config:
    maxmemory-policy: "volatile-lfu"
  shards: 1
  replicas: 0
  networking:
    tls:
      certificate:
        secretName: valkey-cert
  users:
    - name: lule
      enabled: true
      passwordSecret:
        name: valkey-user
        keys:
          - lule
      commands:
        allow: ["@all"]
      keys:
        readWrite: ["*"]

#valkey-user secret should be deployed already