apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-cert
  namespace: envoy-gateway-system
spec:
  secretName: argocd-mikekim1032-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  commonName: argocd.mikekim1032.shop
  dnsNames:
    - argocd.mikekim1032.shop

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backend-cert
  namespace: envoy-gateway-system
spec:
  secretName: backend-mikekim1032-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  commonName: backend.mikekim1032.shop
  dnsNames:
    - backend.mikekim1032.shop