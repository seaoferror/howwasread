apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: aws-nlb-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        annotations:
          "service.beta.kubernetes.io/aws-load-balancer-type": "external"
          "service.beta.kubernetes.io/aws-load-balancer-nlb-target-type": "ip"
          "service.beta.kubernetes.io/aws-load-balancer-scheme": "internet-facing"

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: aws-nlb-config
    namespace: envoy-gateway-system
---

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster-gateway
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: my-issuer
spec:
  gatewayClassName: eg
  listeners:
    - name: backend
      hostname: "backend.mikekim1032.shop"
      port: 80
      protocol: HTTP
      #      tls:
      #        mode: Terminate
      #        certificateRefs:
      #          - name: server-mikekim1032-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: argocd
      hostname: "argocd.mikekim1032.shop"
      port: 80
      protocol: HTTP
      #      tls:
      #        mode: Terminate
      #        certificateRefs:
      #          - name: argo-mikekim1032-tls
      allowedRoutes:
        namespaces:
          from: All