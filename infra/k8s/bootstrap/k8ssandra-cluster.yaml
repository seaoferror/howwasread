apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: k8ssandra-cluster
  namespace: k8ssandra
spec:
  cassandra:
    serverVersion: "5.0.9"
    clientEncryptionStores:
      keystoreSecretRef:
        name: k8ssandra-jks
      truststoreSecretRef:
        name: k8ssandra-jks
    serverEncryptionStores:
      keystoreSecretRef:
        name: k8ssandra-jks
      truststoreSecretRef:
        name: k8ssandra-jks
    datacenters:
      - metadata:
          name: dc1
        size: 1
        config:
          jvmOptions:
            heapSize: 1Gi
          cassandraYaml:
            client_encryption_options:
              enabled: true
              optional: false
            server_encryption_options:
              internode_encryption: all
        storageConfig:
          cassandraDataVolumeClaimSpec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi


