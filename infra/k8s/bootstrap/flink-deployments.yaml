apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: conversation-cdc-job
  namespace: flink
spec:
  image: ghcr.io/seaoferror/flink/conversationcdcjob:latest
  podTemplate:
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: flink-main-container
          imagePullPolicy: Always
          volumeMounts:
            - name: kafka-user
              mountPath: "/cert/kafka/user"
              readOnly: true
            - name: kafka-ca
              mountPath: "/cert/kafka/cluster"
              readOnly: true
          envFrom:
            - configMapRef:
                name: config-map
      volumes:
        - name: kafka-user
          secret:
            secretName: kafka-user
        - name: kafka-ca
          secret:
            secretName: kafka-cluster-cluster-ca-cert
  flinkVersion: v2_2
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    # no keyed state (source offsets are operator state), so no rocksdb and no managed memory
    state.backend.type: hashmap
    execution.checkpointing.interval: "10s"
    taskmanager.memory.managed.fraction: "0.0"
    # sql planning runs in the jobmanager, it needs more metaspace and heap than the datastream jobs
    jobmanager.memory.jvm-metaspace.size: "160m"
    taskmanager.memory.jvm-metaspace.size: "160m"
    taskmanager.memory.jvm-overhead.min: "64m"
    taskmanager.memory.framework.heap.size: "64m"
    taskmanager.memory.framework.off-heap.size: "64m"
    taskmanager.memory.network.min: "32m"
    taskmanager.memory.network.max: "32m"
    jobmanager.memory.jvm-overhead.min: "64m"
    jobmanager.memory.off-heap.size: "64m"
  serviceAccount: flink
  jobManager:
    resource:
      memory: "512m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "640m"
      cpu: 0.5
  job:
    jarURI: local:///opt/flink/usrlib/conversationcdcjob.jar
    entryClass: conversationcdcjob.ConversationCdcJob
    parallelism: 1
    upgradeMode: stateless
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: flink
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: flink
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: flink
roleRef:
  kind: Role
  name: flink
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map
  namespace: flink
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap.kafka-system.svc.cluster.local:9093"
  KAFKA_USER_CERT_PATH: "/cert/kafka/user/user.crt"
  KAFKA_USER_KEY_PATH: "/cert/kafka/user/user.key"
  KAFKA_CA_CERT_PATH: "/cert/kafka/cluster/ca.crt"
  VITESS_VTGATE_HOST: "vitess-cluster-vtgate-6e607aba.vitess.svc.cluster.local"
  VITESS_VTGATE_GRPC_PORT: "15999"