apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: scheduled-notification-job
  namespace: flink
spec:
  image: ghcr.io/seaoferror/flink/schedulednotificationjob:latest
  podTemplate:
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: flink-main-container
          imagePullPolicy: Always
          volumeMounts:
            - name: kafka-user
              mountPath: "/cert/kafka/user"
              readOnly: true
            - name: kafka-ca
              mountPath: "/cert/kafka/cluster"
              readOnly: true
          envFrom:
            - configMapRef:
                name: config-map
      volumes:
        - name: kafka-user
          secret:
            secretName: kafka-user
        - name: kafka-ca
          secret:
            secretName: kafka-cluster-cluster-ca-cert
  flinkVersion: v2_2
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    state.backend.type: rocksdb
    execution.checkpointing.incremental: "true"
    taskmanager.memory.managed.size: "64m"
    jobmanager.memory.jvm-metaspace.size: "128m"
    taskmanager.memory.jvm-metaspace.size: "160m"
    taskmanager.memory.jvm-overhead.min: "64m"
    taskmanager.memory.framework.heap.size: "64m"
    taskmanager.memory.framework.off-heap.size: "64m"
    taskmanager.memory.network.min: "32m"
    taskmanager.memory.network.max: "32m"
    jobmanager.memory.jvm-overhead.min: "64m"
    jobmanager.memory.off-heap.size: "64m"
  serviceAccount: flink
  jobManager:
    resource:
      memory: "400m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "640m"
      cpu: 0.5
  job:
    jarURI: local:///opt/flink/usrlib/schedulednotificationjob.jar
    entryClass: schedulednotificationjob.ScheduledNotificationJob
    parallelism: 2
    upgradeMode: stateless
---
