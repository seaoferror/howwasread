apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-storage-class
  annotations:
    # This annotation marks this storage class as the default provider
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com # Connects directly to your aws-ebs-csi-driver addon
volumeBindingMode: WaitForFirstConsumer # Ensures volume is created in the same AZ as the node chosen for the pod
allowVolumeExpansion: true
parameters:
  type: gp3 # Uses modern, cost-efficient AWS gp3 volumes