server:
  port: 8080
spring:
  profiles:
    active: ${PROFILE}
  threads:
    virtual:
      enabled: true
  application:
    name: offlineconversation
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_URL}/conversation
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 25
      max-lifetime: 300000
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: validate
    show_sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 1000
  kafka:
    bootstrap-servers: ${KAFKA_ADDRESS}
logging:
  level:
    org.springframework.web.socket: INFO
    org.springframework.messaging: INFO