syntax = "proto3";

option go_package = "backend/proto";

package notificationservice;

service NotificationService {
  rpc NotifyMessaging(NotifyMessagingRequest) returns (NotifyMessagingResponse);
}

message NotifyMessagingRequest {
  repeated bytes toIds = 1;
  bytes roomId = 2;
  bytes fromId = 3;
  string contentType = 4;
  string content = 5;
}

message NotifyMessagingResponse {
}