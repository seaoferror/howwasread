plugins {
    id 'java'
    // Shadow plugin for building the Fat JAR (GradleUp fork, compatible with Gradle 9+)
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.howwasread'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

ext {
    flinkVersion = '2.2.1'
    kafkaConnectorVersion = '5.0.0-2.2'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"
    compileOnly "org.apache.flink:flink-clients:${flinkVersion}"
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    implementation "org.apache.flink:flink-connector-kafka:${kafkaConnectorVersion}"
    implementation "org.apache.flink:flink-statebackend-rocksdb:${flinkVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind"
}

shadowJar {
    archiveBaseName.set('schedulednotificationjob')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())

    manifest {
        attributes 'Main-Class': 'com.howwasread.ScheduledNotificationJob'
    }

    // Relocate Kafka client to avoid classpath conflicts on the Flink cluster
    relocate 'org.apache.kafka', 'com.howwasread.shaded.kafka'

    mergeServiceFiles()
}

// Make 'build' depend on 'shadowJar' so `./gradlew build` produces the fat JAR
tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}