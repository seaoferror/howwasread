name: expo-notification
on:
  push:
    branches:
      - main
    paths:
      - 'backend/expo-notification/**'
      - '.github/workflows/expo-notification.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout github
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build and push expo-notification
        env:
          REGISTRY: ghcr.io
          REPOSITORY: ${{ github.repository_owner }}/backend/expo-notification
          IMAGE_TAG: latest
        run: |
          IMAGE_NAME=$(echo "$REGISTRY/$REPOSITORY:$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
          
          docker buildx build --platform linux/amd64 \
          -t $IMAGE_NAME \
          -f ./backend/expo-notification/Dockerfile ./backend/expo-notification --push